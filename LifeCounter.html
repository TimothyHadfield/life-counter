<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Life Counter</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262a33; --text: #e8eaf0; --muted: #8a90a0;
    --accent: #f5b041; --accent-soft: #3a2f1a; --good: #4cc38a; --danger: #e5604d;
    --tabh: 64px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }

  #app { height: 100dvh; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top); }

  /* Top bar: people chips + people/settings button */
  .top { display: flex; align-items: center; gap: 8px; padding: 10px 12px 8px; }
  .chips { flex: 1; min-width: 0; display: flex; gap: 6px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none;
    -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; touch-action: pan-x; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; padding: 6px 12px; border-radius: 999px; background: var(--panel);
    color: var(--muted); white-space: nowrap; transition: background .15s, color .15s, transform .1s;
  }
  .chip:active, .iconbtn:active, .btn:active { transform: scale(.95); }
  .chip.on { background: var(--accent); color: #1a1406; font-weight: 600; }
  .chip.add { color: var(--accent); }
  .iconbtn { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--panel); display: grid; place-items: center; transition: transform .1s; }
  .iconbtn.acct { position: relative; }
  .iconbtn.acct .dot { position: absolute; top: 3px; right: 3px; width: 8px; height: 8px; border-radius: 50%; background: var(--good); display: none; }
  .iconbtn.acct.on .dot { display: block; }
  .bd { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .bd input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
  .bd .nm { flex: 1; min-width: 0; }
  .bd .yr { width: 84px; font: inherit; font-size: 16px; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  .status { font-size: 13px; color: var(--muted); margin: 4px 0 0; }
  .iconbtn svg { width: 18px; height: 18px; stroke: var(--text); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* Panels */
  main { flex: 1; min-height: 0; position: relative; }
  .panel { background: var(--panel); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; min-height: 0; }
  .ph { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .ph h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0; flex: 1; }
  .scroll { overflow-y: auto; min-height: 0; flex: 1; }

  /* Live */
  .cal { font-size: 15px; color: var(--muted); }
  .big { font-size: clamp(34px, 11vw, 56px); font-weight: 700; letter-spacing: -.02em; line-height: 1.05; margin: 2px 0 2px; }
  .bigunit { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  .rows { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; }
  .row { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .row b { font-weight: 600; }
  .next { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: var(--accent-soft); }
  .next .t { font-weight: 600; color: var(--accent); }
  .approx { font-size: 12px; color: var(--muted); margin-top: 8px; }

  /* Milestones */
  .ms { display: grid; grid-template-columns: 1fr auto; column-gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .ms .when { text-align: right; color: var(--muted); font-size: 13px; }
  .ms .d { color: var(--muted); font-size: 13px; }
  .ms.past { opacity: .5; }
  .ms.past .lbl::before { content: "✓ "; color: var(--good); }
  .ms.up .lbl { color: var(--accent); font-weight: 600; }
  .ms.past.would .lbl::before { content: ""; }
  .passed { font-size: 13px; color: var(--muted); font-style: italic; margin-bottom: 2px; }

  /* Compare */
  .cmpbtn { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--line); display: inline-grid; place-items: center; transition: transform .1s; }
  .cmpbtn:active { transform: scale(.9); }
  .cmpbtn svg { width: 16px; height: 16px; stroke: var(--accent); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .cmp-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .cmp-head h3 { margin: 0; }
  .cmp-head select {
    font: inherit; font-size: 16px; font-weight: 600; color: var(--accent); background: var(--bg); border: 1px solid var(--line);
    border-radius: 10px; padding: 6px 28px 6px 10px; -webkit-appearance: none; appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--accent) 50%), linear-gradient(135deg, var(--accent) 50%, transparent 50%);
    background-position: right 14px center, right 9px center; background-size: 5px 5px; background-repeat: no-repeat;
  }
  .cmp-sum { padding: 8px 12px; border-radius: 10px; background: var(--accent-soft); margin-bottom: 6px; font-size: 14px; }
  .cmp { display: grid; grid-template-columns: 0.9fr 1.1fr 1.1fr 1fr; column-gap: 8px; font-size: 13px; }
  .cmp > div { padding: 6px 0; border-bottom: 1px solid var(--line); min-width: 0; overflow-wrap: anywhere; }
  .cmp .h { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  .cmp .k { color: var(--muted); }
  .cmp .d { color: var(--accent); text-align: right; }
  .pick { display: flex; flex-direction: column; gap: 6px; }
  .pick .btn { text-align: left; }

  /* Switch */
  .sw { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .sw input { display: none; }
  .sw i { width: 34px; height: 20px; border-radius: 999px; background: var(--line); position: relative; transition: background .15s; }
  .sw i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--text); transition: transform .15s; }
  .sw input:checked + i { background: var(--accent); }
  .sw input:checked + i::after { transform: translateX(14px); }

  /* Facts */
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  .fact { padding: 6px 0; border-bottom: 1px solid var(--line); min-width: 0; }
  .fact .k { font-size: 12px; color: var(--muted); }
  .fact .v { font-weight: 600; overflow-wrap: anywhere; }

  /* Friends */
  .pair { padding: 8px 0; border-bottom: 1px solid var(--line); }
  .pair .n { font-weight: 600; }
  .pair .s { font-size: 13px; color: var(--muted); }
  .sub { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 12px 0 2px; }

  .btn { padding: 8px 14px; border-radius: 10px; background: var(--line); transition: transform .1s; }
  .btn.primary { background: var(--accent); color: #1a1406; font-weight: 600; }
  .btn.small { padding: 5px 10px; font-size: 13px; }
  .btn.danger { color: var(--danger); }
  .q { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--muted); color: var(--muted); font-size: 12px; display: inline-grid; place-items: center; }

  /* Phone: one tab at a time, bottom tab bar */
  .view { position: absolute; inset: 0 12px 10px; display: none; }
  .view.on { display: flex; }
  .tabs {
    display: flex; height: calc(var(--tabh) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
    border-top: 1px solid var(--line); background: var(--bg);
  }
  .tabs button { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; color: var(--muted); transition: color .15s; }
  .tabs button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .tabs button.on { color: var(--accent); }
  .tabs button.hub svg { width: 28px; height: 28px; }

  /* Laptop: everything at once, no tabs */
  @media (min-width: 900px) {
    #app { max-width: 1400px; margin: 0 auto; }
    main { display: grid; grid-template-columns: 1.1fr 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 12px; padding: 0 12px 12px; }
    .view { position: static; display: flex; inset: auto; }
    #v-live { grid-column: 1; grid-row: 1 / 3; }
    #v-ms { grid-column: 2; grid-row: 1 / 3; }
    #v-facts { grid-column: 3; grid-row: 1; }
    #v-friends { grid-column: 3; grid-row: 2; }
    .tabs { display: none; }
    .rows { grid-template-columns: 1fr; }
    .big { font-size: 56px; }
  }

  /* Sheet (people, add/edit, backup) */
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.55); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 10; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; max-height: 88dvh; overflow-y: auto; z-index: 11;
    background: var(--panel); border-radius: 18px 18px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
    transform: translateY(100%); transition: transform .25s ease;
  }
  @media (min-width: 900px) { .sheet { left: 50%; right: auto; width: 440px; margin-left: -220px; bottom: auto; top: 10vh; border-radius: 18px; transform: translateY(20px); opacity: 0; pointer-events: none; transition: transform .2s, opacity .2s; } }
  .open .sheet-bg { opacity: 1; pointer-events: auto; }
  .open .sheet { transform: none; opacity: 1; pointer-events: auto; }
  .sheet h3 { margin: 0 0 12px; font-size: 17px; }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
  .field span { font-size: 12px; color: var(--muted); }
  .field input {
    font: inherit; font-size: 16px; color: var(--text); background: var(--bg); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 12px; width: 100%; -webkit-appearance: none; min-height: 44px;
  }
  .field input:focus { outline: none; border-color: var(--accent); }
  .actions { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
  .plist .p { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .plist .p div { flex: 1; min-width: 0; }
  .note { font-size: 13px; color: var(--muted); margin: 8px 0 0; }

  /* First run */
  .welcome { max-width: 420px; margin: 8vh auto 0; padding: 0 16px; }
  .welcome h1 { font-size: 28px; margin: 0 0 4px; }
</style>
</head>
<body>
<div id="app"></div>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"></div>

<script src="lifecalc.js"></script>
<script src="sync.js"></script>
<script>
'use strict';
const L = window.LifeCalc;
const STORE = 'lifecounter.v1';
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ---------- data ----------
// Signed out: people live under STORE. Signed in: a local copy of the account under lifecounter.acct.<uid>.
let storeKey = STORE, acctUid = null;
function load(key) {
  try {
    const s = JSON.parse(localStorage.getItem(key));
    if (s && Array.isArray(s.people)) return { deleted: {}, calendarId: null, tab: 'live', showPast: false, ...s };
  } catch (e) {}
  return { people: [], deleted: {}, calendarId: null, selected: null, tab: 'live', showPast: false };
}
let state = load(STORE);
function persist() { try { localStorage.setItem(storeKey, JSON.stringify(state)); } catch (e) {} }
function save() { persist(); if (acctUid && window.LCCloud) LCCloud.push(); }
const plain = o => JSON.parse(JSON.stringify(o));

// The cloud module (cloud.js) talks to the app only through this.
window.LCApp = {
  enterAccount(uid) {
    if (acctUid === uid) return;
    const ui = { selected: state.selected, tab: state.tab, showPast: state.showPast };
    acctUid = uid; storeKey = 'lifecounter.acct.' + uid;
    state = { ...load(storeKey), ...ui };
    render();
  },
  leaveAccount() {
    if (acctUid) { acctUid = null; storeKey = STORE; state = load(STORE); render(); }
    refreshCloudBits();
  },
  guestDoc() { const g = load(STORE); return plain({ people: g.people, deleted: g.deleted || {} }); },
  getDoc() { return plain({ people: state.people, deleted: state.deleted || {} }); },
  applyDoc(d) {
    if (JSON.stringify(d.people) === JSON.stringify(state.people) && JSON.stringify(d.deleted) === JSON.stringify(state.deleted)) return;
    state.people = d.people; state.deleted = d.deleted || {};
    persist();
    keepScroll('v-ms', () => keepScroll('v-friends', render));
  },
  calendarId() { return state.calendarId || null; },
  setCalendarId(id, fromServer) { state.calendarId = id; persist(); if (!fromServer) save(); },
  cloudChanged() { refreshCloudBits(); },
};
const person = () => state.people.find(p => p.id === state.selected) || state.people[0];
const uid = () => Math.random().toString(36).slice(2, 10);

// ---------- formatting ----------
const fmt = (n, dp = 0) => n.toLocaleString('en-US', { minimumFractionDigits: dp, maximumFractionDigits: dp });
const short = n => n >= 1e12 ? fmt(n / 1e12, 2) + ' trillion' : n >= 1e9 ? fmt(n / 1e9, 2) + ' billion' : n >= 1e6 ? fmt(n / 1e6, 1) + ' million' : fmt(n);
const dateStr = (d, timed) => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
  + (timed ? ' ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) : '');
function span(from, to) {
  const a = from <= to ? L.calendarAge(from, to) : L.calendarAge(to, from);
  if (a.years) return `${a.years}y ${a.months}m`;
  if (a.months) return `${a.months}m ${a.days}d`;
  if (a.days) return `${a.days}d ${a.hours}h`;
  return `${a.hours}h ${a.minutes}m`;
}
const rel = (d, now) => d > now ? 'in ' + span(now, d) : span(d, now) + ' ago';

// ---------- render ----------
const ICON = {
  people: '<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.5 3.3-5.5 6.5-5.5s5.9 2 6.5 5.5"/><path d="M16 4.8a3.5 3.5 0 0 1 0 6.4M18.5 14.8c1.6.8 2.7 2.6 3 5.2"/></svg>',
  live: '<svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9.5 2.5h5"/></svg>',
  ms: '<svg viewBox="0 0 24 24"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>',
  facts: '<svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></svg>',
  friends: '<svg viewBox="0 0 24 24"><circle cx="8" cy="9" r="3"/><circle cx="16" cy="9" r="3"/><path d="M2.5 19c.5-3 2.8-4.5 5.5-4.5s5 1.5 5.5 4.5M13 15c.9-.3 1.9-.5 3-.5 2.7 0 5 1.5 5.5 4.5"/></svg>',
  user: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><circle cx="12" cy="10" r="3.2"/><path d="M6 18.6c1.3-2.2 3.4-3.4 6-3.4s4.7 1.2 6 3.4"/></svg>',
  cal: '<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4M12 13v5M9.5 15.5h5"/></svg>',
};

function render() {
  const app = $('#app');
  if (!state.people.length) { app.innerHTML = welcomeHTML(); bindForm($('#app'), null); return; }
  const p = person();
  state.selected = p.id;
  const oldChips = $('.chips'), chipsX = oldChips ? oldChips.scrollLeft : 0;
  app.innerHTML = `
    <div class="top">
      <div class="chips">
        ${state.people.map(x => `<button class="chip ${x.id === p.id ? 'on' : ''}" data-pick="${esc(x.id)}">${esc(x.name)}</button>`).join('')}
        <button class="chip add" data-add>+ Add</button>
      </div>
      <button class="iconbtn" data-people aria-label="People and backup">${ICON.people}</button>
      <button class="iconbtn acct" data-account aria-label="Account">${ICON.user}<i class="dot"></i></button>
    </div>
    <main>
      <section class="view panel" id="v-live"></section>
      <section class="view panel" id="v-ms"></section>
      <section class="view panel" id="v-facts"></section>
      <section class="view panel" id="v-friends"></section>
    </main>
    <nav class="tabs">
      <button data-tab="live" class="hub">${ICON.live}Live</button>
      <button data-tab="ms">${ICON.ms}Milestones</button>
      <button data-tab="facts">${ICON.facts}Facts</button>
      <button data-tab="friends">${ICON.friends}Friends</button>
    </nav>`;
  renderLive(); renderMilestones(); renderFacts(); renderFriends(); setTab(state.tab);
  // Keep the people row where it was, and keep the picked person in view.
  const chips = $('.chips'), on = $('.chip.on'), left = on.offsetLeft - chips.offsetLeft;
  chips.scrollLeft = chipsX;
  if (left < chips.scrollLeft) chips.scrollLeft = left - 12;
  else if (left + on.offsetWidth > chips.scrollLeft + chips.clientWidth) chips.scrollLeft = left + on.offsetWidth - chips.clientWidth + 12;
}

function setTab(t) {
  state.tab = t; persist(); // tab, picked person and Past toggle are this device's view only: no cloud write
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'v-' + t));
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
}

function renderLive() {
  const el = $('#v-live'); if (!el) return;
  const p = person(), b = L.birthDate(p), now = new Date(), end = L.asOf(p, now), gone = end < now;
  const a = L.ages(b, end), c = a.calendar;
  const next = L.milestones(b).find(m => m.date > now);
  const wouldBe = gone ? L.calendarAge(b, now) : null;
  el.innerHTML = `
    <div class="ph"><h2>${esc(p.name)}</h2>${compareBtn(p)}</div>
    ${gone ? `<div class="passed">Passed ${dateStr(end)} · would be ${wouldBe.years} today</div>` : ''}
    <div class="cal num">${gone ? 'Lived ' : ''}${c.years}y ${c.months}m ${c.days}d ${c.hours}h ${String(c.minutes).padStart(2, '0')}m ${String(c.seconds).padStart(2, '0')}s</div>
    <div class="big num">${fmt(Math.floor(a.seconds))}</div>
    <div class="bigunit">${gone ? 'seconds lived' : 'seconds old'}</div>
    <div class="rows num">
      <div class="row"><span class="muted">Years</span><b>${fmt(a.years, 8)}</b></div>
      <div class="row"><span class="muted">Months</span><b>${fmt(a.months)}</b></div>
      <div class="row"><span class="muted">Weeks</span><b>${fmt(a.weeks, 4)}</b></div>
      <div class="row"><span class="muted">Days</span><b>${fmt(a.days, 3)}</b></div>
      <div class="row"><span class="muted">Hours</span><b>${fmt(Math.floor(a.hours))}</b></div>
      <div class="row"><span class="muted">Minutes</span><b>${fmt(Math.floor(a.minutes))}</b></div>
    </div>
    ${next ? `<div class="next"><div class="t">${gone ? 'Would have hit' : 'Next'}: ${esc(next.label)}</div>
      <div class="num">${dateStr(next.date, next.timed && p.time)} · ${rel(next.date, now)}</div></div>` : ''}
    ${p.time ? '' : '<div class="approx">No birth time, so counting from noon.</div>'}`;
}

function renderMilestones(jump) {
  const el = $('#v-ms'); if (!el) return;
  const p = person(), b = L.birthDate(p), now = new Date(), died = L.diedDate(p);
  const all = L.milestones(b);
  const nextKey = (all.find(m => m.date > now) || {}).key;
  const list = state.showPast ? all : all.filter(m => m.date > now);
  const label = m => died && m.date > died ? 'Would have: ' + m.label : m.label;
  el.innerHTML = `
    <div class="ph"><h2>Milestones</h2>
      <label class="sw"><input type="checkbox" data-past ${state.showPast ? 'checked' : ''}><i></i>Past</label>
      <button class="iconbtn" data-ics aria-label="Add to calendar">${ICON.cal}</button>
      <button class="q" data-help="ics">?</button>
    </div>
    <div class="scroll">
      ${list.map(m => `<div class="ms ${m.date <= now ? (died && m.date > died ? 'past would' : 'past') : ''} ${m.key === nextKey ? 'up' : ''}">
        <div class="lbl">${esc(label(m))}</div><div class="when num">${rel(m.date, now)}</div>
        <div class="d num">${dateStr(m.date, m.timed && p.time)}</div><div></div>
      </div>`).join('')}
    </div>`;
  const up = $('.ms.up', el);
  if (up && state.showPast && jump) up.scrollIntoView({ block: 'center' });
}

// Minute refreshes must not move a list the user has scrolled.
function keepScroll(id, fn) {
  const s = $(`#${id} .scroll`), top = s ? s.scrollTop : 0;
  fn();
  const n = $(`#${id} .scroll`); if (n) n.scrollTop = top;
}

function renderFacts() {
  const el = $('#v-facts'); if (!el) return;
  const p = person(), b = L.birthDate(p), now = L.asOf(p, new Date()), f = L.facts(b, now);
  const g = f.golden.date > now ? `${dateStr(f.golden.date)} (${f.golden.age})` : `✓ at ${f.golden.age} (${f.golden.date.getFullYear()})`;
  const items = [
    ['Born on a', f.bornOn],
    ...(p.died ? [] : [['Next birthday', `${f.turning} on a ${f.nextBirthdayWeekday}`]]),
    ['Zodiac', f.zodiac],
    ['Chinese zodiac', f.chinese + (f.chineseExact ? '' : ' (by year)')],
    ['Birthstone', f.birthstone],
    ['Generation', f.generation],
    ['Golden birthday', g],
    ['Leap days lived', fmt(f.leapDays)],
    ...f.planets.map(x => [`Age on ${x.name}`, fmt(x.age, 2)]),
    ['Heartbeats ≈', short(f.heartbeats)],
    ['Breaths ≈', short(f.breaths)],
    ['Years asleep ≈', fmt(f.sleptYears, 1)],
    ['Full moons', fmt(Math.floor(f.fullMoons))],
    ['Miles around Sun', short(f.sunMiles)],
  ];
  el.innerHTML = `<div class="ph"><h2>Facts</h2><button class="q" data-help="facts">?</button></div>
    <div class="scroll"><div class="facts">
      ${items.map(([k, v]) => `<div class="fact"><div class="k">${k}</div><div class="v num">${esc(v)}</div></div>`).join('')}
    </div></div>`;
}

function renderFriends() {
  const el = $('#v-friends'); if (!el) return;
  const p = person(), b = L.birthDate(p), now = new Date();
  const others = state.people.filter(x => x.id !== p.id);
  if (!others.length) {
    el.innerHTML = `<div class="ph"><h2>Friends</h2></div>
      <p class="muted">Add a friend to compare.</p>
      <div><button class="btn primary" data-add>+ Add friend</button></div>`;
    return;
  }
  const pairs = others.map(o => {
    const c = L.compare(b, L.birthDate(o));
    const gap = span(new Date(0), new Date(c.gapMs));
    const twice = c.aIsOlder ? twiceLine(p, o, c.doubleAgeDay, 'div class="s num"') : twiceLine(o, p, c.doubleAgeDay, 'div class="s num"');
    return `<div class="pair"><div class="n" style="display:flex;align-items:center;gap:8px"><span style="flex:1">${esc(o.name)} <span class="muted">· ${c.gapMs === 0 ? 'same age' : (c.aIsOlder ? 'younger' : 'older') + ' by ' + gap}</span></span>${compareBtn(p, o)}</div>
      <div class="s num">${fmt(Math.round(c.gapMs / 1000))} seconds apart · ${fmt(Math.round(c.gapDays))} days</div>
      ${c.gapMs ? twice : ''}</div>`;
  }).join('');
  const upcoming = state.people.flatMap(x => L.milestones(L.birthDate(x)).filter(m => m.date > now).map(m => ({ ...m, who: x })))
    .sort((a, c) => a.date - c.date).slice(0, 8)
    .map(m => `<div class="ms"><div class="lbl"><b>${esc(m.who.name)}</b> · ${m.who.died ? 'would have: ' : ''}${esc(m.label)}</div><div class="when num">${rel(m.date, now)}</div>
      <div class="d num">${dateStr(m.date)}</div><div></div></div>`).join('');
  el.innerHTML = `<div class="ph"><h2>Friends</h2></div>
    <div class="scroll">${pairs}<div class="sub">Up next, everyone</div>${upcoming}</div>`;
}

// ---------- first run + forms ----------
function formHTML(p) {
  return `
    <label class="field"><span>Name</span><input name="name" maxlength="40" value="${p ? esc(p.name) : ''}" placeholder="${state.people.length ? 'Name' : 'Me'}" required></label>
    <label class="field"><span>Birthday</span><input name="date" type="date" value="${p ? esc(p.date) : ''}" required></label>
    <label class="field"><span>Birth time (optional)</span><input name="time" type="time" value="${p && p.time ? esc(p.time) : ''}"></label>
    ${state.people.length ? `<label class="field"><span>Passed (optional)</span><input name="died" type="date" value="${p && p.died ? esc(p.died) : ''}"></label>` : ''}
    <div class="actions"><button class="btn primary" data-save>Save</button>
      ${p ? `<button class="btn" data-cancel>Cancel</button>` : (state.people.length ? `<button class="btn" data-cancel>Cancel</button>` : '')}</div>`;
}
function welcomeHTML() {
  return `<div class="welcome"><h1>Life Counter</h1><p class="muted">Start with your birthday.</p>${formHTML(null)}
    <p class="note">Have an account? <button class="btn small" data-signin>Sign in with Google</button></p></div>`;
}
function bindForm(root, existing) {
  $('[data-save]', root).onclick = () => {
    const name = $('[name=name]', root).value.trim() || (state.people.length ? '' : 'Me');
    const date = $('[name=date]', root).value;
    const time = $('[name=time]', root).value || null;
    if (!name) { $('[name=name]', root).focus(); return; }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || new Date(date) > new Date()) { $('[name=date]', root).focus(); return; }
    const diedEl = $('[name=died]', root), died = diedEl && diedEl.value || null;
    if (died && (died < date || new Date(died) > new Date())) { diedEl.focus(); return; }
    if (existing) { Object.assign(existing, { name, date, time, died, updated: Date.now() }); delete existing.noYear; }
    else { const p = { id: uid(), name, date, time, died, updated: Date.now() }; state.people.push(p); state.selected = p.id; }
    save(); closeSheet(); render();
  };
  const c = $('[data-cancel]', root); if (c) c.onclick = closeSheet;
}

// ---------- sheet ----------
let sheetKind = null;
function openSheet(html, after, kind = null) {
  sheetKind = kind;
  $('#sheet').innerHTML = html; document.body.classList.add('open'); if (after) after($('#sheet'));
}
function closeSheet() { sheetKind = null; document.body.classList.remove('open'); }

// ---------- account + Google Calendar ----------
const SAVE_WORDS = { loading: 'Loading…', saved: 'Saved to your account', saving: 'Saving…', offline: 'Offline · saves when back online', error: 'Couldn’t save · will retry' };

function refreshCloudBits() {
  const b = $('.iconbtn.acct');
  if (b) b.classList.toggle('on', !!(window.LCCloud && LCCloud.user));
  if (sheetKind === 'account') accountSheet();
}

function accountSheet() {
  const C = window.LCCloud;
  if (!C) {
    openSheet(`<h3>Account</h3><p class="muted">Accounts can’t load right now. Check your connection.</p>
      <div class="actions"><button class="btn" data-cancel>Close</button></div>`, null, 'account');
    return;
  }
  if (!C.user) {
    openSheet(`<h3>Account</h3><p>Save your people on every device.</p>
      <div class="actions"><button class="btn primary" data-signin>Continue with Google</button><button class="btn" data-cancel>Close</button></div>
      <p class="note">Without an account, people stay on this device only.</p>`, null, 'account');
    return;
  }
  const linked = !!state.calendarId;
  openSheet(`<h3>Account</h3>
    <div>${esc(C.user.email || '')}</div>
    <p class="status">${SAVE_WORDS[C.status] || ''}</p>
    <div class="sub" style="display:flex;align-items:center;gap:8px"><span style="flex:1">Google Calendar</span><button class="q" data-help="gcal">?</button></div>
    <div class="actions">
      <button class="btn primary" data-calsync>${linked ? 'Sync milestones' : 'Add milestones to Google Calendar'}</button>
      <button class="btn" data-findbd>Find birthdays</button>
    </div>
    <p class="status">${esc(C.calStatus || (linked ? 'Milestones go in your “Life Counter” calendar.' : ''))}</p>
    <div class="actions" style="margin-top:14px"><button class="btn" data-signout>Sign out</button><button class="btn" data-cancel>Close</button></div>`, null, 'account');
}

function birthdaySheet(found) {
  const rows = found.map((f, i) => {
    const have = L && window.LifeSync.alreadyHave(state.people, f);
    return `<label class="bd"><input type="checkbox" data-i="${i}" ${have ? 'disabled' : 'checked'}>
      <div class="nm"><b>${esc(f.name)}</b><div class="muted num" style="font-size:13px">${have ? 'Already added' : f.noYear ? dateStr(new Date(2000, +f.date.slice(5, 7) - 1, +f.date.slice(8))).replace(/, 2000$/, '') + ' · year?' : dateStr(L.birthDate({ date: f.date }))}</div></div>
      ${f.noYear && !have ? `<input class="yr" type="number" inputmode="numeric" placeholder="Year" min="1900" max="${new Date().getFullYear()}" data-y="${i}">` : ''}</label>`;
  }).join('');
  openSheet(`<h3>Birthdays in Google Calendar</h3>
    ${found.length ? `<div>${rows}</div><p class="note">Ones without a year are skipped unless you add it.</p>
      <div class="actions"><button class="btn primary" data-addbd>Add checked</button><button class="btn" data-cancel>Cancel</button></div>`
      : `<p class="muted">None found.</p><div class="actions"><button class="btn" data-cancel>Close</button></div>`}`, el => {
    const add = $('[data-addbd]', el);
    if (add) add.onclick = () => {
      let n = 0;
      el.querySelectorAll('input[type=checkbox][data-i]').forEach(cb => {
        if (!cb.checked || cb.disabled) return;
        const f = found[+cb.dataset.i];
        let date = f.date;
        if (f.noYear) {
          const y = +($(`[data-y="${cb.dataset.i}"]`, el) || {}).value;
          if (!(y >= 1900 && y <= new Date().getFullYear())) return;
          date = String(y) + f.date.slice(4);
        }
        state.people.push({ id: uid(), name: f.name.slice(0, 40), date, time: null, died: null, googleId: f.googleId, updated: Date.now() });
        n++;
      });
      save(); closeSheet(); render();
      if (n) setTimeout(() => alert(`Added ${n} ${n === 1 ? 'person' : 'people'}.`), 50);
    };
  });
}
$('#sheetBg').onclick = closeSheet;

function addSheet() { openSheet(`<h3>Add person</h3>${formHTML(null)}`, el => bindForm(el, null)); }
function editSheet(p) { openSheet(`<h3>Edit ${esc(p.name)}</h3>${formHTML(p)}`, el => bindForm(el, p)); }

function peopleSheet() {
  openSheet(`<h3>People</h3>
    <div class="plist">${state.people.map(p => `<div class="p"><div><b>${esc(p.name)}</b>
      <div class="muted num" style="font-size:13px">${dateStr(L.birthDate(p))}${p.time ? ' · ' + esc(p.time) : ''}${p.died ? ' – ' + dateStr(L.diedDate(p)) : ''}</div></div>
      ${compareBtn(p)}<button class="btn small" data-edit="${esc(p.id)}">Edit</button><button class="btn small danger" data-del="${esc(p.id)}">Delete</button></div>`).join('')}</div>
    <div class="actions"><button class="btn primary" data-add>+ Add</button><button class="btn" data-ics-all>Calendar: everyone</button></div>
    <div class="sub">Backup</div>
    <div class="actions"><button class="btn" data-export>Save backup</button><button class="btn" data-import>Load backup</button></div>
    <p class="note">Birthdays stay on this device only.</p>`, el => {
    el.onclick = e => {
      const t = e.target.closest('button'); if (!t) return;
      if (t.dataset.edit) editSheet(state.people.find(p => p.id === t.dataset.edit));
      else if (t.dataset.del) {
        const p = state.people.find(x => x.id === t.dataset.del);
        if (confirm(`Delete ${p.name}?`)) {
          state.people = state.people.filter(x => x !== p);
          state.deleted = { ...(state.deleted || {}), [p.id]: Date.now() };
          save(); render(); state.people.length ? peopleSheet() : closeSheet();
        }
      }
      else if ('add' in t.dataset) addSheet();
      else if ('icsAll' in t.dataset) downloadIcs(state.people, 'life-counter-everyone');
      else if ('export' in t.dataset) download(JSON.stringify({ app: 'life-counter', v: 2, people: state.people }, null, 2), 'life-counter-backup.json', 'application/json');
      else if ('import' in t.dataset) importBackup();
    };
  });
}

function download(text, name, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}
function downloadIcs(people, name) { download(L.buildIcs(people, new Date()), name + '.ics', 'text/calendar'); }

function importBackup() {
  const input = document.createElement('input'); input.type = 'file'; input.accept = '.json,application/json';
  input.onchange = async () => {
    try {
      const data = JSON.parse(await input.files[0].text());
      const incoming = window.LifeSync.cleanImport(data, state.people.map(p => p.id), new Date(), uid);
      for (const p of incoming) state.people.push({ ...p, updated: Date.now() });
      save(); render(); peopleSheet();
    } catch (e) { alert('That file is not a Life Counter backup.'); }
  };
  input.click();
}

const HELP = {
  gcal: `<h3>Google Calendar</h3><p class="muted">Google will say the app isn’t verified: tap <b>Advanced</b> → <b>Go to Life Counter</b>.</p>
    <p class="muted">Milestones go in their own “Life Counter” calendar, so your events are never touched. Delete that calendar to remove them all.</p>
    <p class="muted">Sync runs when you tap it, and on its own after edits for an hour after that. Find birthdays reads the birthdays already in your Google Calendar.</p>
    <div class="actions"><button class="btn" data-account>Back</button></div>`,
  ics: `<h3>Add to calendar</h3><p>Downloads one file with every upcoming milestone.</p>
    <p class="muted">iPhone: tap the file, then "Add All" (Apple Calendar).<br>Google Calendar: on a computer, open
    <a href="https://calendar.google.com/calendar/r/settings/export" target="_blank" rel="noopener" style="color:var(--accent)">Google Calendar → Import</a> and pick the file.
    Re-importing updates events instead of doubling them.</p>
    <div class="actions"><button class="btn" data-cancel>Close</button></div>`,
  facts: `<h3>About these</h3><p class="muted">≈ numbers are estimates: 80 heartbeats and 16 breaths a minute, a third of life asleep.
    Golden birthday is when your age matches your birth day.</p>
    <div class="actions"><button class="btn" data-cancel>Close</button></div>`,
};

// "Sam was twice Tim's age on …" — skipped if either had passed by then.
function twiceLine(older, younger, day, tag) {
  const gone = [older, younger].some(x => x.died && day > L.diedDate(x));
  if (gone) return '';
  const verb = day > new Date() ? 'will be' : 'was';
  return `<${tag}>${esc(older.name)} ${verb} twice ${esc(younger.name)}'s age on ${dateStr(day)}</${tag.split(' ')[0]}>`;
}

// ---------- compare ----------
const CMP_ICON = '<svg viewBox="0 0 24 24"><path d="M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/></svg>';
function compareBtn(a, b) {
  if (state.people.length < 2) return '';
  return `<button class="cmpbtn" data-cmp="${esc(a.id)}" ${b ? `data-cmp-b="${esc(b.id)}"` : ''} aria-label="Compare ${esc(a.name)}">${CMP_ICON}</button>`;
}

function openCompare(aId, bId) {
  const a = state.people.find(p => p.id === aId);
  const others = state.people.filter(p => p.id !== aId);
  if (!a || !others.length) return;
  if (!bId && others.length > 1) {
    openSheet(`<h3>Compare ${esc(a.name)} with…</h3><div class="pick">
      ${others.map(o => `<button class="btn" data-cmp="${esc(a.id)}" data-cmp-b="${esc(o.id)}">${esc(o.name)}</button>`).join('')}</div>
      <div class="actions"><button class="btn" data-cancel>Cancel</button></div>`);
    return;
  }
  const b = state.people.find(p => p.id === bId) || others[0];
  openSheet(compareHTML(a, b, others), el => {
    $('select', el).onchange = e => openCompare(a.id, e.target.value);
  });
}

function compareHTML(a, b, others) {
  const now = new Date();
  const ba = L.birthDate(a), bb = L.birthDate(b);
  const ea = L.asOf(a, now), eb = L.asOf(b, now);
  const A = L.ages(ba, ea), B = L.ages(bb, eb);
  const Fa = L.facts(ba, ea), Fb = L.facts(bb, eb);
  const c = L.compare(ba, bb);
  const older = c.aIsOlder ? a : b, younger = c.aIsOlder ? b : a;
  const gap = span(new Date(0), new Date(c.gapMs));
  const diff = (x, y, dp = 0) => Math.abs(x - y) >= 1e9 ? short(Math.abs(x - y)) : fmt(Math.abs(x - y), dp);
  const row = (k, va, vb, d = '') => `<div class="k">${k}</div><div class="num">${esc(va)}</div><div class="num">${esc(vb)}</div><div class="d num">${d}</div>`;
  const head = (t, d = 'Diff') => `<div class="h">${t}</div><div class="h">${esc(a.name)}</div><div class="h">${esc(b.name)}</div><div class="h" style="text-align:right">${d}</div>`;
  const ageRows = [
    ['Years', A.years, B.years, 2], ['Months', A.months, B.months, 0], ['Weeks', A.weeks, B.weeks, 0],
    ['Days', A.days, B.days, 0], ['Hours', A.hours, B.hours, 0], ['Minutes', A.minutes, B.minutes, 0], ['Seconds', A.seconds, B.seconds, 0],
  ].map(([k, x, y, dp]) => row(k, fmt(dp ? x : Math.floor(x), dp), fmt(dp ? y : Math.floor(y), dp), diff(Math.floor(x * 10 ** dp) / 10 ** dp, Math.floor(y * 10 ** dp) / 10 ** dp, dp))).join('');
  const same = (x, y) => x === y ? 'same' : '';
  const factRows = [
    row('Born on a', Fa.bornOn, Fb.bornOn, same(Fa.bornOn, Fb.bornOn)),
    row('Zodiac', Fa.zodiac, Fb.zodiac, same(Fa.zodiac, Fb.zodiac)),
    row('Chinese', Fa.chinese, Fb.chinese, same(Fa.chinese, Fb.chinese)),
    row('Birthstone', Fa.birthstone, Fb.birthstone, same(Fa.birthstone, Fb.birthstone)),
    row('Generation', Fa.generation, Fb.generation, same(Fa.generation, Fb.generation)),
    row('Leap days', fmt(Fa.leapDays), fmt(Fb.leapDays), diff(Fa.leapDays, Fb.leapDays)),
    ...Fa.planets.map((p, i) => row(`On ${p.name}`, fmt(p.age, 2), fmt(Fb.planets[i].age, 2), diff(p.age, Fb.planets[i].age, 2))),
    row('Heartbeats ≈', short(Fa.heartbeats), short(Fb.heartbeats), short(Math.abs(Fa.heartbeats - Fb.heartbeats))),
    row('Breaths ≈', short(Fa.breaths), short(Fb.breaths), short(Math.abs(Fa.breaths - Fb.breaths))),
    row('Full moons', fmt(Math.floor(Fa.fullMoons)), fmt(Math.floor(Fb.fullMoons)), diff(Math.floor(Fa.fullMoons), Math.floor(Fb.fullMoons))),
    row('Sun miles', short(Fa.sunMiles), short(Fb.sunMiles), short(Math.abs(Fa.sunMiles - Fb.sunMiles))),
  ].join('');
  const ma = L.milestones(ba), mb = L.milestones(bb);
  const msRows = ma.map(m => {
    const n = mb.find(x => x.key === m.key);
    const cell = (p, d) => (p.died && d > L.diedDate(p) ? '(' : '') + dateStr(d) + (p.died && d > L.diedDate(p) ? ')' : '');
    const first = m.date.getTime() === n.date.getTime() ? 'same' : (m.date < n.date ? a.name : b.name);
    return row(m.label, cell(a, m.date), cell(b, n.date), esc(first));
  }).join('');
  return `
    <div class="cmp-head"><h3>${esc(a.name)} vs</h3>
      <select aria-label="Compare with">${others.map(o => `<option value="${esc(o.id)}" ${o.id === b.id ? 'selected' : ''}>${esc(o.name)}</option>`).join('')}</select>
      <span style="flex:1"></span><button class="btn small" data-cancel>Close</button></div>
    <div class="cmp-sum">${c.gapMs ? `<b>${esc(older.name)}</b> is older by ${gap} · ${fmt(Math.round(c.gapMs / 1000))} seconds<br>
      ${twiceLine(older, younger, c.doubleAgeDay, 'span class="muted"')}` : 'Same birthday and time'}</div>
    <div class="cmp">${head('Age')}${ageRows}</div>
    <div class="cmp" style="margin-top:12px">${head('Facts')}${factRows}</div>
    <div class="cmp" style="margin-top:12px">${head('Milestone', 'First')}${msRows}</div>
    ${a.died || b.died ? '<p class="note">(Dates) = would have been.</p>' : ''}`;
}

// ---------- events ----------
document.addEventListener('click', e => {
  const t = e.target.closest('button, input[data-past]'); if (!t) return;
  if (t.dataset.cmp) return openCompare(t.dataset.cmp, t.dataset.cmpB);
  // Google popups must open straight from the tap, so no awaits before these calls.
  if ('account' in t.dataset) return accountSheet();
  if (t.dataset.help) return openSheet(HELP[t.dataset.help]);
  if ('signin' in t.dataset) { if (window.LCCloud) LCCloud.signIn(); else accountSheet(); return; }
  if ('signout' in t.dataset) { if (window.LCCloud) LCCloud.signOut(); return closeSheet(); }
  if ('calsync' in t.dataset) { if (window.LCCloud) LCCloud.syncCalendar(); return; }
  if ('findbd' in t.dataset) {
    if (window.LCCloud) LCCloud.findBirthdays().then(found => { if (found) birthdaySheet(found); });
    return;
  }
  if (t.closest('#sheet') && !('cancel' in t.dataset)) return;
  if ('cancel' in t.dataset) return closeSheet();
  if (t.dataset.pick) { state.selected = t.dataset.pick; persist(); render(); }
  else if (t.dataset.tab) setTab(t.dataset.tab);
  else if ('add' in t.dataset) addSheet();
  else if ('people' in t.dataset) peopleSheet();
  else if ('past' in t.dataset) { state.showPast = t.checked; persist(); renderMilestones(true); }
  else if ('ics' in t.dataset) { const p = person(); downloadIcs([p], 'life-counter-' + p.name.toLowerCase().replace(/[^a-z0-9]+/g, '-')); }
  else if (t.dataset.help) openSheet(HELP[t.dataset.help]);
});

// Live tick every second; the rest refreshes each minute.
let lastMinute = -1;
setInterval(() => {
  if (!state.people.length || document.hidden) return;
  renderLive();
  const m = new Date().getMinutes();
  if (m !== lastMinute) { lastMinute = m; keepScroll('v-ms', renderMilestones); keepScroll('v-friends', renderFriends); }
}, 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && state.people.length) render(); });

render();
</script>
<script type="module" src="cloud.js"></script>
</body>
</html>
